global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ラズパイ本体のメトリクス（CPU, メモリ, ディスク, 温度）
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'raspi5'

  # Docker コンテナのメトリクス
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
