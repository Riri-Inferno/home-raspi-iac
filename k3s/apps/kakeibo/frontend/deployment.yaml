---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kakeibo-frontend
  namespace: kakeibo
  annotations:
    reloader.stakater.com/auto: "true"
    # Keel: registry の :latest digest 変化を 5 分間隔で polling 検知 → rollout 駆動。
    # match-tag=true で「同じ tag (=latest) の digest 変化のみ」追従、tag 検知ではない。
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kakeibo-frontend
  template:
    metadata:
      labels:
        app: kakeibo-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/riri-inferno/serverlesskakeibo/frontend:latest
          ports:
            - containerPort: 80
              name: http
# 環境変数はビルド時に焼き込まれているのでないです
