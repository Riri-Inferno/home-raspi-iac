---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-rs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Riri-Inferno/home-raspi-iac.git
    targetRevision: develop
    path: k3s/apps/ai-gateway-rs
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  # Keel が Pod template に書く update-time annotation は selfHeal の対象外にする。
  # これが無いと Keel が rollout を打った直後に ArgoCD selfHeal が annotation を巻き戻して
  # 結果的に何も更新されない（=Keel と ArgoCD の永久ループ）。
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/keel.sh~1update-time
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
