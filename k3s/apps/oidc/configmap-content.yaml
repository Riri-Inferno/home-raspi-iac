---
# k3s が発行する SA token の検証に必要な OIDC discovery / JWKS を静的に配信する。
# issuer / jwks_uri は外部公開 URL に書き換え済。
# JWKS の内容は k3s の SA signing key を反映する。
# クラスタ完全再構築で k3s の signing key が新規発行され、kid が変化した
# 同様の再構築ごとに /openid/v1/jwks を取り直して更新すること。
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-content
  namespace: oidc
data:
  openid-configuration: |
    {
      "issuer": "https://oidc.riri-inferno.com/",
      "jwks_uri": "https://oidc.riri-inferno.com/openid/v1/jwks",
      "response_types_supported": ["id_token"],
      "subject_types_supported": ["public"],
      "id_token_signing_alg_values_supported": ["RS256"]
    }
  jwks: |
    {"keys":[{"use":"sig","kty":"RSA","kid":"0a5m7cN3iiCDTAJN5ZFoC5-PFGFz0CEjf_DntW5PeWY","alg":"RS256","n":"1ClNH-W9kCGJ5j1pwkq5UsFpiS4ubOgW15mVVygp38d5EBHMrd-iZekyE3bPImGkbR2hlFNv7Z5mSMrbsN4Bm3_I5GCAr0Xu3EDYkfc0-Qg9Nov0Dnqetyp9Em9_Lx9jHUsBAkXyunWaEcdrsY4FEN3FmKJmrItbD2bMvsGNMqSYPeoPQ0CkD-oP1Wb9zgJncvGlZKyi-thsHHNSEnWZHVNEI0Ebj3Cn17maq0hFz7hQKG_YRCF8JO97GddtMfcw7veDGFQkjN99cZBPu0psApqW84WuHc-jGhGh3P_aftHhnV3LrvwnrO88JK6FeZJAvDiU1P5mpoidVVIPPYp5vQ","e":"AQAB"}]}
