---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-server
  namespace: oidc
  annotations:
    # ConfigMap (oidc-content / oidc-nginx-config) は subPath mount のため
    # 自動更新されない。Reloader でクラスタ再構築や JWKS rotation 時に
    # Pod を rollout して新値を反映させる。
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-server
  template:
    metadata:
      labels:
        app: oidc-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: oidc-content
              mountPath: /usr/share/oidc/openid-configuration
              subPath: openid-configuration
            - name: oidc-content
              mountPath: /usr/share/oidc/jwks
              subPath: jwks
      volumes:
        - name: nginx-config
          configMap:
            name: oidc-nginx-config
        - name: oidc-content
          configMap:
            name: oidc-content
